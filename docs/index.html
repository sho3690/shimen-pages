<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Front Page">
  <meta name="theme-color" content="#e4e9f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e121b" media="(prefers-color-scheme: dark)">
  <script>
    /* 保存された紙面の色（白/黒）を、描画前に適用する。後から当てるとちらつく */
    (function () {
      try {
        var t = localStorage.getItem("shimen-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./css/hig.css?v=20261017015509">
  <link rel="stylesheet" href="./css/paper.css?v=20261017015509">
  <meta name="robots" content="noindex, nofollow">
  <script>window.STATIC_MODE = true;
  window.SHIMEN_BUILD = "20261017015509";
  window.SHIMEN_REPO = "sho3690/shimen-pages";
  window.SHIMEN_LABEL = "feed-request";</script>
  <title>Front Page</title>
</head>
<body>
  <header class="toolbar">
    <button id="build" class="btn" type="button">今日の紙面をつくる</button>
  </header>

  <div id="notices" aria-live="polite"></div>

  <div id="progress" class="progress" hidden>
    <div class="progress__track"><div id="progress-fill" class="progress__fill"></div></div>
    <p id="progress-text" class="progress__text"></p>
  </div>

  <!-- 設定（歯車）。紙面を描くと題字の右上へ移す。紙面を読めなかったときはここに残る -->
  <div id="corner" class="corner">
    <div id="settings-control" class="menu-anchor">
      <button id="open-menu" class="icon-btn" type="button" aria-label="設定"
              aria-haspopup="menu" aria-expanded="false" aria-controls="settings-menu">
        <svg class="icon icon-btn__gear" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M19.81 13.17 L22.26 14.65 L21.13 17.38 L18.35 16.70 L16.70 18.35 L17.38 21.13 L14.65 22.26 L13.17 19.81 L10.83 19.81 L9.35 22.26 L6.62 21.13 L7.30 18.35 L5.65 16.70 L2.87 17.38 L1.74 14.65 L4.19 13.17 L4.19 10.83 L1.74 9.35 L2.87 6.62 L5.65 7.30 L7.30 5.65 L6.62 2.87 L9.35 1.74 L10.83 4.19 L13.17 4.19 L14.65 1.74 L17.38 2.87 L16.70 5.65 L18.35 7.30 L21.13 6.62 L22.26 9.35 L19.81 10.83 Z"/>
          <circle cx="12" cy="12" r="3.2"/>
        </svg>
      </button>
      <div id="settings-menu" class="menu" role="menu" aria-labelledby="open-menu">
        <button id="open-settings" class="menu__item" type="button" role="menuitem" tabindex="-1">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="5.5" cy="18.5" r="1.6" class="icon--fill"/>
            <path d="M4 11a9 9 0 0 1 9 9"/>
            <path d="M4 4a16 16 0 0 1 16 16"/>
          </svg>
          <span>フィードを見る</span>
        </button>
        <button id="toggle-theme" class="menu__item" type="button" role="menuitem" tabindex="-1">
          <svg id="theme-icon-light" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>
          </svg>
          <svg id="theme-icon-dark" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
          </svg>
          <span id="toggle-theme-label">紙面の色を切り替える</span>
        </button>
      </div>
    </div>
  </div>

  <main id="paper" class="paper" aria-live="polite"></main>

  <footer id="wifi" class="footnote"></footer>

  <section id="settings" class="sheet" hidden aria-labelledby="settings-title">
    <div class="sheet__head">
      <h2 id="settings-title" class="sheet__title">フィード</h2>
      <button id="close-settings" class="btn btn--quiet" type="button">閉じる</button>
    </div>

    <form id="add-feed" style="padding-bottom:1.5em">
      <label class="label" for="feed-url">RSSのURLを貼り付け</label>
      <input id="feed-url" class="field" type="url" inputmode="url"
             autocomplete="off" autocapitalize="off" spellcheck="false"
             placeholder="https://example.com/rss">
      <p id="add-feed-error" class="banner banner--error" hidden></p>
      <button id="add-feed-submit" class="btn" type="submit"
              style="margin-top:0.75em">追加する</button>
    </form>

    <div id="feed-list"></div>
  </section>

  <script src="./js/api.js?v=20261017015509"></script>
  <script src="./js/render.js?v=20261017015509"></script>
  <script src="./js/flip.js?v=20261017015509"></script>
  <script src="./js/app.js?v=20261017015509"></script>
</body>
</html>
